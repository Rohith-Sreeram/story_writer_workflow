<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrewAI Flow Visualization</title>

    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #network {
            width: 100%;
            height: 100%;
            background: #ffffff;
        }
    </style>
</head>

<body>

<div id="network"></div>

<script>
    const nodes = new vis.DataSet([
        {
            id: "start",
            label: "start",
            shape: "box",
            color: {
                background: "#e8f5e9",
                border: "#43a047"
            },
            font: { size: 18 },
            margin: 15
        },
        {
            id: "generate",
            label: "generate",
            shape: "box",
            color: {
                background: "#e3f2fd",
                border: "#1e88e5"
            },
            font: { size: 18 },
            margin: 15
        },
        {
            id: "eval",
            label: "eval",
            shape: "box",
            color: {
                background: "#fff3e0",
                border: "#fb8c00"
            },
            font: { size: 18 },
            margin: 15
        },
        {
            id: "retry",
            label: "retry",
            shape: "box",
            color: {
                background: "#fce4ec",
                border: "#d81b60"
            },
            font: { size: 18 },
            margin: 15
        },
        {
            id: "finish",
            label: "finish",
            shape: "box",
            color: {
                background: "#ede7f6",
                border: "#5e35b1"
            },
            font: { size: 18 },
            margin: 15
        }
    ]);

    const edges = new vis.DataSet([
        {
            id: "edge1",
            from: "start",
            to: "generate",
            arrows: "to"
        },
        {
            id: "edge2",
            from: "generate",
            to: "eval",
            arrows: "to"
        },
        {
            id: "edge3",
            from: "eval",
            to: "finish",
            arrows: "to"
        }
    ]);

    const container = document.getElementById("network");

    const data = {
        nodes: nodes,
        edges: edges
    };

    const options = {
        layout: {
            hierarchical: {
                enabled: true,
                direction: "UD",
                sortMethod: "directed",
                levelSeparation: 150,
                nodeSpacing: 250
            }
        },

        physics: false,

        interaction: {
            dragNodes: true,
            dragView: true,
            zoomView: true,
            hover: true
        },

        nodes: {
            borderWidth: 2,
            shadow: true
        },

        edges: {
            width: 2,
            arrows: {
                to: {
                    enabled: true,
                    scaleFactor: 0.8
                }
            },
            smooth: {
                enabled: true,
                type: "cubicBezier",
                forceDirection: "vertical",
                roundness: 0.4
            }
        }
    };

    new vis.Network(container, data, options);
</script>

</body>
</html>
